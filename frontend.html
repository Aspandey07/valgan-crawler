<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valgan Tenders Viewer</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; }
        h1 { color: #2c3e50; text-align: center; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .search-box { margin-bottom: 20px; text-align: center; }
        input[type="text"] { padding: 10px; width: 60%; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { padding: 10px 20px; background-color: #3498db; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #2980b9; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #2c3e50; color: white; }
        tr:hover { background-color: #f1f1f1; }
        a { color: #3498db; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h1>Valgan Tenders Viewer</h1>
    
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search by keyword (e.g. Tree, Fire)...">
        <button onclick="fetchTenders()">Search</button>
    </div>

    <table id="tendersTable">
        <thead>
            <tr>
                <th>Tender ID</th>
                <th>Title</th>
                <th>Department</th>
                <th>Closing Date</th>
                <th>PDF Link</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Data will appear here -->
        </tbody>
    </table>
</div>

<script>
    async function fetchTenders() {
        const query = document.getElementById('searchInput').value;
        const url = `http://localhost:3000/api/v1/tenders?q=${query}`;
        
        try {
            const response = await fetch(url);
            const result = await response.json();
            
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = ''; // Clear old data

            if (result.data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No tenders found!</td></tr>';
                return;
            }

            result.data.forEach(tender => {
                const date = tender.closingDate ? new Date(tender.closingDate).toLocaleDateString() : 'N/A';
                const pdfLink = tender.pdfUrl ? `<a href="${tender.pdfUrl}" target="_blank">Download PDF</a>` : 'No PDF';
                
                const row = `<tr>
                    <td>${tender.tenderId}</td>
                    <td><strong>${tender.title}</strong></td>
                    <td>${tender.department}</td>
                    <td>${date}</td>
                    <td>${pdfLink}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        } catch (error) {
            alert('Error fetching data! Make sure API Server is running on port 3000.');
            console.error(error);
        }
    }

    fetchTenders();
</script>

</body>
</html>
