<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valgan Procurement Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #0f172a;
            --surface: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- Login Screen --- */
        #loginScreen {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            background: radial-gradient(circle at top right, #1e1b4b, var(--bg-color));
        }

        .login-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        .login-card h1 {
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .login-card p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--primary-hover);
        }

        /* --- Dashboard Screen --- */
        #dashboardScreen {
            display: none;
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            animation: fadeIn 0.5s ease-out;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .header h1 {
            font-size: 24px;
        }

        .header-actions button {
            width: auto;
            background: transparent;
            border: 1px solid var(--border);
            padding: 8px 16px;
            font-weight: 500;
        }
        
        .header-actions button:hover {
            background: var(--surface);
        }

        .search-container {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .search-container input {
            flex: 1;
        }
        
        .search-container button {
            width: 120px;
        }

        .table-container {
            background: var(--surface);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: rgba(15, 23, 42, 0.5);
            font-weight: 600;
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        td {
            font-size: 14px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .tag {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 500;
            background: rgba(79, 70, 229, 0.2);
            color: #818cf8;
        }
        
        a {
            color: #60a5fa;
            text-decoration: none;
        }
        a:hover { text-decoration: underline; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .error-msg {
            color: var(--danger);
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="loginScreen">
        <div class="login-card">
            <h1>Valgan Data Platform</h1>
            <p>Reviewer Access Portal</p>
            
            <div class="input-group">
                <label>Security Key (Hint: valgan-secret-key-2026)</label>
                <input type="password" id="apiKeyInput" placeholder="Enter API Key..." onkeypress="handleLoginEnter(event)">
            </div>
            
            <button onclick="handleLogin()">Secure Login</button>
            <div id="loginError" class="error-msg">Invalid API Key.</div>
        </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboardScreen">
        <div class="header">
            <div>
                <h1>Procurement Intelligence</h1>
                <p style="color: var(--text-muted); font-size: 14px; margin-top: 4px;">Live Data from UK Contracts Finder</p>
            </div>
            <div class="header-actions">
                <a href="/api-docs" target="_blank" style="margin-right: 16px; font-size: 14px;">API Docs</a>
                <button onclick="logout()">Sign Out</button>
            </div>
        </div>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search tenders by keyword (e.g. Services, Fire, Tree)..." onkeypress="handleEnter(event)">
            <button onclick="fetchTenders()">Search</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Tender ID</th>
                        <th>Title & Description</th>
                        <th>Department</th>
                        <th>Closing Date</th>
                        <th>Documents</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="5" style="text-align: center; color: var(--text-muted); padding: 40px;">
                            Click search to fetch procurement records.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_BASE_URL = window.location.origin;
        let currentApiKey = '';

        function handleLogin() {
            const key = document.getElementById('apiKeyInput').value;
            if (!key) {
                showError('API Key is required');
                return;
            }
            // In a real app, we'd verify the key with the server first.
            // For this POC, we'll store it and try a request.
            currentApiKey = key;
            
            // Try fetching health/ready or just proceed to dashboard
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboardScreen').style.display = 'block';
            fetchTenders();
        }

        function logout() {
            currentApiKey = '';
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('dashboardScreen').style.display = 'none';
            document.getElementById('apiKeyInput').value = '';
            document.getElementById('searchInput').value = '';
        }

        function showError(msg) {
            const err = document.getElementById('loginError');
            err.textContent = msg;
            err.style.display = 'block';
        }

        function handleEnter(e) {
            if (e.key === 'Enter') {
                fetchTenders();
            }
        }

        function handleLoginEnter(e) {
            if (e.key === 'Enter') {
                handleLogin();
            }
        }

        async function fetchTenders() {
            const query = document.getElementById('searchInput').value;
            const url = `${API_BASE_URL}/api/v1/tenders?q=${encodeURIComponent(query)}`;
            const tbody = document.getElementById('tableBody');
            
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 40px; color: var(--text-muted);">Fetching data...</td></tr>';
            
            try {
                const response = await fetch(url, {
                    headers: { 'x-api-key': currentApiKey }
                });
                const result = await response.json();
                
                tbody.innerHTML = '';

                if (response.status === 401) {
                    logout();
                    showError('Authentication failed. Invalid API Key.');
                    return;
                }

                if (!response.ok) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color: var(--danger); padding: 40px;">Error: ${result.error?.message || 'Failed to fetch'}</td></tr>`;
                    return;
                }

                if (!result.data || result.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 40px; color: var(--text-muted);">No tenders found.</td></tr>';
                    return;
                }

                result.data.forEach(item => {
                    const tr = document.createElement('tr');
                    
                    const date = item.closingDate ? new Date(item.closingDate).toLocaleDateString() : 'N/A';
                    
                    tr.innerHTML = `
                        <td style="font-family: monospace; color: #94a3b8;">${item.tenderId}</td>
                        <td>
                            <div style="font-weight: 600; margin-bottom: 4px; color: white;">${item.title}</div>
                        </td>
                        <td><span class="tag">${item.department}</span></td>
                        <td>${date}</td>
                        <td>
                            <a href="${item.pdfUrl || item.detailUrl || '#'}" target="_blank" class="tag" style="text-decoration: none; color: white;">
                                ${item.pdfUrl ? 'View PDF' : 'View Details'}
                            </a>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color: var(--danger); padding: 40px;">Connection Error. Make sure the server is running.</td></tr>`;
            }
        }
    </script>
</body>
</html>
