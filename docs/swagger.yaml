openapi: 3.0.0
info:
  title: Valgan Procurement Crawler API
  version: 1.0.0
  description: API for retrieving crawled procurement tenders.
servers:
  - url: http://localhost:3000/api/v1
paths:
  /tenders:
    get:
      summary: Search tenders
      parameters:
        - in: query
          name: q
          schema:
            type: string
          description: Search term for title
        - in: query
          name: department
          schema:
            type: string
        - in: query
          name: portal
          schema:
            type: string
        - in: query
          name: closingDateFrom
          schema:
            type: string
            format: date-time
        - in: query
          name: closingDateTo
          schema:
            type: string
            format: date-time
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [closingDate, createdAt, tenderValue, title]
            default: createdAt
        - in: query
          name: sortOrder
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: A list of tenders
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tender'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
  /tenders/{id}:
    get:
      summary: Get tender details
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tender details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Tender'
        '404':
          description: Tender not found

components:
  schemas:
    Tender:
      type: object
      properties:
        id:
          type: string
          format: uuid
        portalName:
          type: string
        sourceUrl:
          type: string
        tenderId:
          type: string
        title:
          type: string
        department:
          type: string
        closingDate:
          type: string
          format: date-time
        tenderValue:
          type: number
        currency:
          type: string
        detailUrl:
          type: string
        pdfUrl:
          type: string
        localPdfPath:
          type: string
        documentHash:
          type: string
        status:
          type: string
        rawData:
          type: object
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
